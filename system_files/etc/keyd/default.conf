# keyd: one-handed helpers.
#   hold Right Alt + key  -> Super (niri Mod)
#   tap  Right Alt, then a letter -> AltGr (Polish letters: ą ć ę ł ń ó ś ż ź)
#   tap  Right Ctrl, then a key   -> Ctrl + that key   (sticky Ctrl)
#   tap  Right Shift, then a key  -> Shift + that key  (sticky Shift)
#   Holding Right Ctrl / Right Shift still works the normal way.
#   A tap that isn't followed by a key within 1 second is forgotten, so a stray
#   tap doesn't turn a later letter into a capital (or a Ctrl shortcut).
# Emergency stop if keyd ever misbehaves: press Backspace + Escape + Enter together.
[global]
# Forget a tapped Right Alt / Ctrl / Shift after 1 s (milliseconds).
oneshot_timeout = 1000

[ids]
*
# ydotool's virtual keyboard (Speech Note types dictated text through it):
# leave it alone, so dictated Polish letters aren't remapped.
-2333:6666

[main]
rightalt = overload(meta, oneshot(altgr))
rightcontrol = oneshot(control)
rightshift = oneshot(shift)
