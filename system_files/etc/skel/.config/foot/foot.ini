# foot: the backup terminal (used when Ghostty can't start, and by the Welcome
# window). Set up like Ghostty: fish shell, paste with Ctrl+V.

shell=fish
font=monospace:size=12

[key-bindings]
# Copy stays Ctrl+Shift+C here (foot can't let Ctrl+C both copy and interrupt).
clipboard-paste=Control+v Control+Shift+v XF86Paste
