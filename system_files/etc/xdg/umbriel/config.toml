# System-wide Umbriel defaults for this spin (/etc/xdg/umbriel/config.toml).
# A user's ~/.config/umbriel/config.toml replaces this file entirely; copy it
# there to customise. Validate with: umbriel config validate
#
# Keybinds: the same one-handed layout as the fedora-gnc niri setup.
#   * Layout dvorak_r_pl (right-handed Dvorak + Polish letters on AltGr).
#   * Mod = hold Right Alt (keyd turns it into Super); Mod + one key, never Shift.
#   * Keys are named by what they type on dvorak_r_pl; [brackets] = QWERTY keycap.
# The desktop wallpaper is a cheat sheet of these binds: after changing them,
# update artwork/make-cheatsheet.py and re-run it.

[general]
autostart = ["noctalia"]
mod_key = "Super"
show_cheatsheet = false

[environment]
ELECTRON_OZONE_PLATFORM_HINT = "auto"

# Right-handed Dvorak with Polish letters (/etc/xkb/symbols/dvorak_r_pl).
[input.keyboard]
layout = "dvorak_r_pl"
numlock_toggle = true
repeat_rate = 30
repeat_delay = 300

[input.cursor]
hide_when_typing = true

[appearance]
prefer_no_csd = true
border_width = 2
corner_radius = 10

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 3
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

[layout]
extent_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_extent_fraction = 0.5

# ------------------------------------------------------------------------------
# Keybinds. Defining this table replaces Umbriel's built-in set.
[keybinds]
# ---- home row: focus & basics. e h t d = left / down / up / right [G H J K]
"Mod+E" = "window-focus-left"
"Mod+H" = "window-focus-or-workspace-down"
"Mod+T" = "window-focus-or-workspace-up"
"Mod+D" = "window-focus-right"
"Mod+K" = { action = "window-toggle-floating", repeat = false }            # [;]
"Mod+J" = { action = "window-focus-switch-floating", repeat = false }      # [5]
"Mod+Minus" = { action = "overview-toggle", repeat = false }               # [']
"Mod+Return" = { action = "spawn spin-terminal", repeat = false }
"Mod+BackSpace" = { action = "window-close", repeat = false }

# ---- top row: move windows. o r s u sit right above e h t d [T Y U I]
"Mod+O" = "column-move-left"
"Mod+R" = "window-move-or-workspace-down"
"Mod+S" = "window-move-or-workspace-up"
"Mod+U" = "column-move-right"
"Mod+Y" = { action = "window-toggle-fullscreen", repeat = false }          # [O]
"Mod+B" = { action = "window-toggle-maximize", repeat = false }            # [P]
"Mod+Semicolon" = "window-consume-or-expel-left"                           # [[]
"Mod+Equal" = "window-consume-or-expel-right"                              # []]
"Mod+Backslash" = { action = "window-toggle-fullscreen", repeat = false }

# ---- bottom row: workspaces [B N M , . /]
"Mod+N" = "workspace-previous"
"Mod+W" = "workspace-next"
"Mod+V" = "column-move-to-workspace-previous"
"Mod+G" = "column-move-to-workspace-next"
"Mod+Apostrophe" = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }   # [/]
"Mod+Period" = { action = "spawn noctalia msg window-switcher", repeat = false }             # [R]

# ---- number row: size & panels [6 7 8 9 0 - =]
"Mod+L" = "window-cycle-primary-extent"
"Mod+M" = "window-modify-primary-extent -0.10"
"Mod+F" = "window-modify-primary-extent +0.10"
"Mod+P" = "column-center"
"Mod+Slash" = { action = "column-toggle-tabbed", repeat = false }
"Mod+BracketLeft" = { action = "spawn noctalia msg panel-toggle control-center", repeat = false }
"Mod+BracketRight" = { action = "spawn noctalia msg panel-toggle clipboard", repeat = false }

# ---- arrows: sound (focus already lives on e h t d)
"Mod+Up" = { action = "spawn noctalia msg volume-up", allow_when_locked = true }
"Mod+Down" = { action = "spawn noctalia msg volume-down", allow_when_locked = true }
"Mod+Left" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"Mod+Right" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"Mod+F11" = { action = "spawn pavucontrol", repeat = false }

# ---- nav cluster: less frequent
"Mod+Insert" = { action = "cheatsheet-toggle", repeat = false }
"Mod+Delete" = { action = "spawn noctalia msg session lock", repeat = false }
"Mod+Page_Up" = { action = "workspace-focus-last", repeat = false }
"Mod+Page_Down" = { action = "spawn noctalia msg settings-toggle", repeat = false }
"Mod+Home" = { action = "output-focus-next", repeat = false }
"Mod+End" = { action = "window-move-to-output-next", repeat = false }
"Mod+Z" = { action = "workspace-move-to-output-next", repeat = false }      # [D]
"Mod+F8" = { action = "spawn noctalia msg panel-toggle session", repeat = false }

# ---- voice: Speech Note (Flatpak net.mkiol.SpeechNote)
"Mod+C" = { action = "spawn flatpak run net.mkiol.SpeechNote --action start-listening-active-window", repeat = false }
"Mod+I" = { action = "spawn flatpak run net.mkiol.SpeechNote --action stop-listening", repeat = false }
"Mod+A" = { action = "spawn flatpak run net.mkiol.SpeechNote --action start-reading-clipboard", repeat = false }
"Mod+X" = { action = "spawn flatpak run net.mkiol.SpeechNote --action cancel", repeat = false }

# ---- screenshots & emergency
"Print" = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Ctrl+Print" = { action = "spawn noctalia msg screenshot-fullscreen", repeat = false }
"Mod+Print" = { action = "spawn noctalia msg screenshot-window", repeat = false }
"Mod+F9" = { action = "spawn noctalia msg screenshot-window", repeat = false }
"Mod+F10" = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Mod+F12" = { action = "spawn noctalia msg screenshot-fullscreen", repeat = false }
"Mod+Scroll_Lock" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

# ---- mouse wheel, for the times you do grab the mouse
"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }
"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }

# ---- media / volume / brightness keys (with Noctalia OSD)
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down", allow_when_locked = true }

# ------------------------------------------------------------------------------
[[window_rule]]
blur = true
blur_optimized = true

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_position = { x = 20, y = 20, anchor = "bottom_right" }

# Keep compositor shortcuts in virt-manager windows
[[window_rule]]
match.app_id = "^virt-manager$"
allow_shortcuts_inhibit = false

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized = false
