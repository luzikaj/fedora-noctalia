name: build-image

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly rebuild to pick up Fedora/Noctalia updates
  workflow_dispatch:

env:
  FEDORA_VERSION: "45"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build
        run: |
          podman build \
            --build-arg FEDORA_VERSION="$FEDORA_VERSION" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$FEDORA_VERSION" \
            -t "$IMAGE:$FEDORA_VERSION-$(date -u +%Y%m%d)" \
            .

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in latest "$FEDORA_VERSION" "$FEDORA_VERSION-$(date -u +%Y%m%d)"; do
            podman push "$IMAGE:$tag"
          done
