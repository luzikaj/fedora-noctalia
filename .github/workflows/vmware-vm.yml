name: build-vmware-vm

# Ready-to-open VMware Workstation VM: unzip, then File > Open the .vmx.
# Password: repo secret VM_PASSWORD if set, otherwise "changeme".
# Change it after first login with `passwd`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        default: latest
      username:
        description: User to create (member of wheel)
        default: luzikaj
      size:
        description: Root filesystem size
        default: 40 GiB

env:
  VM_NAME: fedora-noctalia

jobs:
  vmware:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${{ inputs.tag }}" >> "$GITHUB_ENV"

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install qemu-img
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-utils

      - name: Pull image into root storage
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "$IMAGE"

      - name: Write builder config (user + disk size)
        env:
          VM_PASSWORD: ${{ secrets.VM_PASSWORD || 'changeme' }}
          VM_USER: ${{ inputs.username }}
          VM_SIZE: ${{ inputs.size }}
        run: |
          hash=$(openssl passwd -6 "$VM_PASSWORD")
          cat > vm-config.toml <<EOF
          [[customizations.user]]
          name = "$VM_USER"
          password = "$hash"
          groups = ["wheel"]

          [[customizations.filesystem]]
          mountpoint = "/"
          minsize = "$VM_SIZE"

          # Copy the system log to the serial console (serial.log on the host)
          [customizations.kernel]
          append = "console=tty0 console=ttyS0,115200 systemd.journald.forward_to_console=1"
          EOF

      - name: Build disk (qcow2)
        run: |
          mkdir -p output
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v ./vm-config.toml:/config.toml:ro \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 \
            --rootfs ext4 \
            --chown "$(id -u):$(id -g)" \
            "$IMAGE"

      - name: Convert to VMware Workstation disk + add .vmx
        run: |
          mkdir -p "vm/$VM_NAME"
          # monolithicSparse = Workstation's native growable single-file disk (writable,
          # unlike the streamOptimized format meant for OVA import)
          qemu-img convert -p -f qcow2 -O vmdk \
            -o subformat=monolithicSparse,adapter_type=lsilogic \
            output/qcow2/disk.qcow2 "vm/$VM_NAME/$VM_NAME.vmdk"
          sed "s/@NAME@/$VM_NAME/g" vmware/fedora-noctalia.vmx > "vm/$VM_NAME/$VM_NAME.vmx"
          ls -lh "vm/$VM_NAME"
          echo "ART_NAME=fedora-noctalia-45-$(date -u +%Y%m%d)-vmware-vm" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ART_NAME }}
          path: vm/
          retention-days: 7
