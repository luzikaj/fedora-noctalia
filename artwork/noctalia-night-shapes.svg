<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <mask id="crescent">
      <rect width="3840" height="2160" fill="black"/>
      <circle cx="2930" cy="610" r="170" fill="white"/>
      <circle cx="3000" cy="565" r="150" fill="black"/>
    </mask>
    <linearGradient id="wingfill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9a6ff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6f5bd6" stop-opacity="0.02"/>
    </linearGradient>
    <g id="wing">
      <!-- forewing -->
      <path d="M0,-40 C120,-260 420,-420 720,-430 C800,-432 820,-380 780,-320 C700,-200 520,-80 300,-20 C180,10 70,10 0,-10 Z"/>
      <!-- hindwing with long tail -->
      <path d="M0,10 C90,30 260,60 380,150 C470,220 480,330 430,420 C400,480 380,560 420,700 C330,620 300,520 250,450 C170,340 80,200 0,60 Z"/>
    </g>
    <g id="veins">
      <path d="M10,-20 C200,-160 470,-300 720,-400"/>
      <path d="M40,-30 C220,-110 430,-180 610,-230"/>
      <path d="M60,-15 C240,-60 400,-80 520,-90"/>
      <path d="M20,30 C150,110 300,220 400,380"/>
      <path d="M30,40 C110,150 200,300 300,470"/>
    </g>
  </defs>

  <!-- moon glow + crescent -->
  <circle cx="2930" cy="610" r="260" fill="#8f7ae0" opacity="0.30" filter="url(#glow)"/>
  <rect width="3840" height="2160" fill="#efeaff" mask="url(#crescent)"/>

  <!-- moth, line art, subtle -->
  <g transform="translate(1250,1230) rotate(-14) scale(1.15)">
    <g fill="url(#wingfill)" stroke="#a796f0" stroke-opacity="0.32" stroke-width="3" stroke-linejoin="round">
      <use href="#wing"/>
      <use href="#wing" transform="scale(-1,1)"/>
    </g>
    <g fill="none" stroke="#a796f0" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round">
      <use href="#veins"/>
      <use href="#veins" transform="scale(-1,1)"/>
    </g>
    <!-- eye spots -->
    <g fill="none" stroke="#c9bcff" stroke-opacity="0.35" stroke-width="3">
      <circle cx="430" cy="-230" r="46"/><circle cx="-430" cy="-230" r="46"/>
      <circle cx="300" cy="230" r="30"/><circle cx="-300" cy="230" r="30"/>
    </g>
    <g fill="#c9bcff" fill-opacity="0.30">
      <circle cx="430" cy="-230" r="12"/><circle cx="-430" cy="-230" r="12"/>
    </g>
    <!-- body + antennae -->
    <ellipse cx="0" cy="40" rx="26" ry="150" fill="#b9a6ff" fill-opacity="0.22" stroke="#c9bcff" stroke-opacity="0.35" stroke-width="3"/>
    <g fill="none" stroke="#c9bcff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
      <path d="M-8,-105 C-40,-200 -110,-270 -190,-300"/>
      <path d="M8,-105 C40,-200 110,-270 190,-300"/>
    </g>
  </g>
  <!-- faint flight trail toward the moon -->
  <path d="M1650,980 C2050,760 2400,690 2700,660" fill="none" stroke="#a796f0" stroke-opacity="0.10" stroke-width="3" stroke-dasharray="4 26" stroke-linecap="round"/>
</svg>
